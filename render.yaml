services:
  - type: web
    name: ab-diet-counter
    runtime: python
    # インスタンスのメモリ増強：Standard = 2GB RAM / 1 CPU（約$25/月）。
    # 512MBではメモリ上限超過による自動再起動が繰り返し発生していたため引き上げる。
    # ※このplan指定は、サービスがこのBlueprint(render.yaml)と連携している場合に
    #   デプロイ時へ反映される。手動作成のサービスの場合はダッシュボードの
    #   Settings → Instance Type から Standard を選ぶ必要がある。
    plan: standard
    buildCommand: pip install -r requirements.txt
    # 起動の速さとメモリのバランス：
    #  --preload …… 【重要】アプリをマスタープロセスで1回だけ読み込み、ワーカーはforkで作る。
    #                これが無いと、ワーカーが再起動するたびに app.py の import と init_db()
    #                をやり直すため、その間の5〜25秒はアプリが一切応答せず、
    #                利用者には「白い画面」→「サーバー起動中…」と見える。
    #                preload ありならワーカー再起動はfork（ほぼ一瞬）で済む。
    #  --workers 1 …… プロセスは1つに保ち基礎メモリを最小化
    #  --threads 4 …… 1プロセス内でスレッド並行。AI解析の待ち時間中も他の人が使える
    #  --max-requests / jitter …… 一定リクエストごとにワーカーを緩やかに再起動し、
    #                じわじわ増えるメモリ（リーク）を定期的に解放してOOM再起動を防ぐ。
    #                300回は頻繁すぎて（1日に何度も再起動が起きる）体感速度を大きく損なうため
    #                2000回へ緩和する。preload と併用するので再起動しても待ち時間は生じない。
    #  --graceful-timeout 30 …… 再起動時、処理中のリクエストを最大30秒待ってから終了する
    startCommand: gunicorn app:app --preload --timeout 300 --workers 1 --threads 4 --max-requests 2000 --max-requests-jitter 200 --graceful-timeout 30
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
