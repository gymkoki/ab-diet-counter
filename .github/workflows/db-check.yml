name: DB Status Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/db-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wake server and query DB status
        run: |
          echo "=== warming up (Render cold start / deploy in progress) ==="
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ab-diet-counter.onrender.com/ping || echo "000")
            echo "ping attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          echo "=== /db-status (wait for new deploy + backfill) ==="
          last=""
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 60 https://ab-diet-counter.onrender.com/db-status || echo "")
            echo "--- attempt $i ---"
            echo "$body"
            last="$body"
            if echo "$body" | grep -q '"backfill_done": *true'; then
              echo ">>> RESULT: new build live, backfill complete. See daily_b_count above."
              exit 0
            fi
            sleep 12
          done
          echo ">>> last response: $last"
          echo ">>> RESULT: did not observe backfill_done=true within the wait window."
