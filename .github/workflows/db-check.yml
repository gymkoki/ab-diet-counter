name: DB Status Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/db-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged data
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ab-diet-counter.onrender.com/ping || echo "000")
            echo "ping $i -> $code"; [ "$code" = "200" ] && break; sleep 10
          done
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 60 https://ab-diet-counter.onrender.com/db-status || echo "")
            if echo "$body" | grep -q '"tables"'; then echo "$body"; echo ">>> DONE"; exit 0; fi
            echo "attempt $i: not ready"; sleep 12
          done
          echo ">>> timeout"
