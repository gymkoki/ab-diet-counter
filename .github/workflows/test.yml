# 回帰テスト：mainへのPR・pushのたびに自動実行する。
# 「文章入力で通信エラー」(2026-07) のような壊れを、デプロイ前に検知するための保険。
# AIは呼ばない（モック）ため、APIキーは不要で1〜2分で終わる。
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # httpx はテストが直接 import する（APIエラーを作って再現するため）。
          # anthropic の依存として入ることに頼っていたが、それが外れると
          # テストが丸ごと収集エラーになるので、ここで明示的に入れる。
          pip install pytest httpx
          # デイリーレポート（report/send_report.py）の依存。
          # 入れていないと、レポートを import するテストが CI で収集エラーになり、
          # テスト全体が1件も実行されずに失敗する（2026-10-07 に実際に発生）。
          # 入れておけば、これまで CI でスキップされていたレポート系テストも実際に動く。
          pip install -r report/requirements.txt
      - name: Run regression tests
        run: pytest tests/ -q
