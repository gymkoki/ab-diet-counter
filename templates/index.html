<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABダイエット Bカウンター</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="shortcut icon" href="/static/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #FF6B35; --primary-dark: #FF4500; --pink: #FF6B9D;
      --bg: #F7F4EF; --surface: #FFFFFF; --text: #1A1A2E;
      --text-muted: #6B7280; --border: #E5E7EB;
      --b-color: #FF6B35; --a-color: #2EC4B6;
      --shadow: 0 4px 24px rgba(0,0,0,0.08); --radius: 16px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 20px 20px 24px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 800; }
    header p  { margin-top: 4px; font-size: 12px; opacity: 0.85; }

    /* warmup */
    #warmup-banner { display:none; margin:12px 16px 0; background:#FFF8E7; border:1px solid #FCD34D; border-radius:10px; padding:12px 16px; font-size:12px; color:#92400E; align-items:center; gap:10px; }
    .ws { width:16px; height:16px; border:2px solid #FCD34D; border-top-color:#D97706; border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }

    /* tabs */
    .tabs { display:flex; padding:12px 16px 0; gap:6px; }
    .tab { flex:1; padding:10px 6px; border-radius:12px 12px 0 0; border:none; background:var(--border); color:var(--text-muted); font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; position:relative; }
    .tab.active { background:var(--surface); color:var(--primary); box-shadow:0 -2px 8px rgba(0,0,0,0.06); }
    .tab .tab-dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-left:4px; vertical-align:middle; display:none; }
    .tab.has-photo .tab-dot { display:inline-block; background:#FCD34D; }
    .tab.done      .tab-dot { display:inline-block; background:var(--a-color); }

    /* panels */
    .container { padding:0 16px 48px; }
    .tab-panel { display:none; background:var(--surface); border-radius:0 0 var(--radius) var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:16px; }
    .tab-panel.active { display:block; }

    /* photo strip */
    .meal-strip { display:flex; gap:10px; padding:14px 16px 4px; flex-wrap:wrap; }
    .meal-thumb { position:relative; width:88px; height:88px; flex-shrink:0; border-radius:12px; overflow:hidden; background:var(--bg); border:2px solid var(--border); }
    .meal-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .meal-thumb .th-remove { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); color:white; border:none; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .meal-thumb .th-badge { position:absolute; bottom:4px; left:4px; right:4px; background:rgba(255,107,53,0.88); color:white; font-size:10px; font-weight:800; border-radius:6px; padding:2px 4px; text-align:center; }
    .meal-thumb .th-badge.good { background:rgba(217,119,6,0.88); }
    .meal-thumb .th-spinner { position:absolute; inset:0; background:rgba(255,255,255,0.75); display:flex; align-items:center; justify-content:center; }
    .th-spin { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }

    /* add-photo area */
    .meal-add { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px; cursor:pointer; border:2px dashed var(--border); border-radius:12px; margin:10px 16px 4px; transition:border-color 0.2s, background 0.2s; position:relative; }
    .meal-add:hover { border-color:var(--primary); background:#FFF5F0; }
    .meal-add input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .meal-add-icon { font-size:20px; }
    .meal-add h3 { font-size:13px; font-weight:700; }
    .meal-add p  { font-size:11px; color:var(--text-muted); }

    /* loading */
    .meal-loading { display:none; text-align:center; padding:24px 16px; }
    .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .meal-loading p { color:var(--text-muted); font-size:13px; }

    /* result */
    .meal-result { display:none; padding:0 16px 16px; }
    .meal-b-count { background:#FFF5F0; border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .meal-b-count .label { font-size:12px; font-weight:700; color:var(--text-muted); }
    .meal-b-count .count { font-size:36px; font-weight:900; color:var(--primary); line-height:1; }
    .meal-b-count .unit  { font-size:12px; font-weight:600; color:var(--primary); }
    .result-photo { width:100%; border-radius:10px; max-height:200px; object-fit:cover; display:block; margin-bottom:12px; }
    .advice-row { display:flex; gap:8px; align-items:flex-start; background:var(--bg); border-radius:10px; padding:12px; margin-bottom:12px; }
    .advice-row .icon { font-size:16px; flex-shrink:0; }
    .advice-row p { font-size:12px; color:var(--text-muted); line-height:1.6; }
    .food-list-wrap { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .food-list-header { padding:10px 14px; background:var(--bg); font-size:12px; font-weight:700; border-bottom:1px solid var(--border); }
    .food-row { display:grid; grid-template-columns:1fr auto; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); align-items:start; }
    .food-row:last-child { border-bottom:none; }
    .food-name { font-size:13px; font-weight:600; margin-bottom:2px; }
    .food-meta { font-size:10px; color:var(--text-muted); line-height:1.4; }
    .food-badge { display:inline-flex; padding:1px 6px; border-radius:20px; font-size:10px; font-weight:700; margin-right:3px; }
    .badge-b      { background:#FFF0EB; color:var(--b-color); }
    .badge-good-b { background:#FFF8E7; color:#D97706; }
    .badge-a      { background:#E8F9F8; color:var(--a-color); }
    .food-cnt { text-align:right; }
    .food-cnt .n { font-size:18px; font-weight:800; color:var(--b-color); line-height:1; }
    .food-cnt .n.zero { color:var(--a-color); }
    .food-cnt .u { font-size:9px; color:var(--text-muted); }

    /* multi-result cards */
    .item-result-card { border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:12px; }
    .item-result-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--border); font-size:12px; font-weight:700; }
    .item-result-header .ic-cnt { color:var(--primary); font-size:14px; font-weight:900; }

    .re-analyze { width:100%; margin-top:10px; padding:10px; border-radius:10px; background:none; border:1.5px solid var(--border); font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer; }
    .re-analyze:hover { border-color:var(--primary); color:var(--primary); }

    /* error */
    .meal-error { display:none; margin:0 16px 16px; background:#FEF2F2; border:1px solid #FECACA; border-radius:10px; padding:12px 14px; font-size:12px; color:#DC2626; }

    /* daily total card */
    .daily-total-card { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; margin:12px 16px 0; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
    .daily-total-label { font-size:13px; font-weight:700; opacity:0.9; }
    .daily-total-count { font-size:52px; font-weight:900; line-height:1; }
    .daily-total-unit { font-size:13px; font-weight:600; opacity:0.85; margin-left:4px; }

    /* stats bar */
    .stats-bar { display:flex; align-items:stretch; background:var(--surface); margin:10px 16px 0; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .stat-item { flex:1; padding:12px 10px; text-align:center; }
    .stat-btn { background:none; border:none; cursor:pointer; transition:background 0.15s; }
    .stat-btn:active { background:var(--bg); }
    .stat-divider { width:1px; background:var(--border); margin:8px 0; flex-shrink:0; }
    .stat-number { font-size:24px; font-weight:900; color:var(--primary); line-height:1; }
    .stat-label { font-size:10px; color:var(--text-muted); margin-top:3px; font-weight:600; }
    .stat-sub { font-size:10px; color:var(--text-muted); margin-top:2px; }

    /* reset dialog */
    #reset-overlay { display:none; position:fixed; inset:0; z-index:250; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; }
    #reset-overlay.show { display:flex; }
    .reset-dialog { background:var(--surface); border-radius:18px; padding:28px 24px; max-width:320px; width:88%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
    .reset-dialog h3 { font-size:17px; font-weight:800; margin-bottom:10px; }
    .reset-dialog p { font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:20px; }
    .reset-btns { display:flex; gap:10px; }
    .reset-btns button { flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:700; border:none; cursor:pointer; }
    .reset-cancel { background:var(--bg); color:var(--text-muted); }
    .reset-confirm { background:#DC2626; color:white; }

    /* tabs wrapper with reset */
    .tabs-wrapper { display:flex; align-items:flex-end; padding:10px 16px 0; gap:6px; }
    .tabs { display:flex; gap:6px; flex:1; }
    .btn-full-reset { flex-shrink:0; padding:8px 10px; border-radius:12px 12px 0 0; border:1.5px solid #FECACA; border-bottom:none; background:white; color:#DC2626; font-size:10px; font-weight:700; cursor:pointer; text-align:center; line-height:1.5; white-space:nowrap; }
    .btn-full-reset:active { background:#FEF2F2; }

    /* ranking modal */
    #ranking-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); align-items:flex-end; justify-content:center; }
    #ranking-overlay.show { display:flex; }
    .ranking-dialog { background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom,16px); }
    .ranking-header { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px; font-size:16px; font-weight:800; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1; }
    .ranking-header button { background:none; border:none; font-size:18px; color:var(--text-muted); cursor:pointer; width:32px; height:32px; border-radius:50%; }
    .ranking-sub { font-size:12px; color:var(--text-muted); padding:10px 20px 6px; }
    .rank-row { display:flex; align-items:center; padding:12px 20px; border-bottom:1px solid var(--border); gap:12px; }
    .rank-row.is-me { background:#FFF5F0; }
    .rank-row:last-child { border-bottom:none; }
    .rank-num { font-size:16px; font-weight:900; width:28px; text-align:center; color:var(--text-muted); flex-shrink:0; }
    .rank-bar-wrap { flex:1; }
    .rank-bar { height:8px; border-radius:4px; background:var(--border); min-width:4px; transition:width 0.4s; }
    .rank-bar .rank-fill { height:100%; border-radius:4px; background:var(--primary); opacity:0.55; }
    .rank-row.is-me .rank-fill { opacity:1; }
    .rank-count { font-size:13px; font-weight:800; color:var(--text); text-align:right; white-space:nowrap; }
    .rank-me-badge { display:inline-block; font-size:10px; background:var(--primary); color:white; padding:1px 6px; border-radius:10px; font-weight:700; margin-left:4px; }

    /* photo source sheet */
    #photo-source-sheet { display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,0.45); align-items:flex-end; justify-content:center; }
    #photo-source-sheet.show { display:flex; }
    .photo-sheet-dialog { background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:480px; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
    .photo-sheet-btn { display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; border:none; background:none; font-size:16px; font-weight:600; color:var(--text); cursor:pointer; border-radius:12px; }
    .photo-sheet-btn:active { background:var(--bg); }
    .photo-sheet-btn .ps-icon { font-size:22px; width:36px; text-align:center; }
    .photo-sheet-divider { height:1px; background:var(--border); margin:4px 0; }
    .photo-sheet-cancel { display:block; width:100%; margin-top:8px; padding:15px; border:none; background:var(--bg); border-radius:12px; font-size:15px; font-weight:700; color:var(--text-muted); cursor:pointer; }
    .photo-sheet-cancel:active { background:var(--border); }

    /* analyze meal button */
    .analyze-meal-wrap { padding:10px 16px 4px; }
    .btn-analyze-meal { width:100%; padding:15px; border-radius:14px; font-size:15px; font-weight:800; border:none; cursor:pointer; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; box-shadow:0 4px 16px rgba(255,107,53,0.35); transition:opacity 0.2s, transform 0.1s; }
    .btn-analyze-meal:active   { transform:scale(0.97); }
    .btn-analyze-meal:disabled { opacity:0.45; cursor:not-allowed; box-shadow:none; }

    /* lightbox */
    #lightbox { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; cursor:zoom-out; }
    #lightbox.show { display:flex; }
    #lightbox img { max-width:96vw; max-height:92vh; object-fit:contain; border-radius:8px; cursor:default; }
    #lightbox-close { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.15); color:white; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>

<header>
  <h1>ABダイエット Bカウンター</h1>
</header>

<div id="warmup-banner">
  <div class="ws"></div>
  <span>サーバー起動中… 初回のみ30秒ほどかかります ☕</span>
</div>

<div class="daily-total-card">
  <div class="daily-total-label">🍽 今日のBカウント合計</div>
  <div style="text-align:right">
    <span class="daily-total-count" id="daily-total-count">0</span>
    <span class="daily-total-unit">カウント</span>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-number" id="today-users">-</div>
    <div class="stat-label">👥 今日の利用者</div>
  </div>
  <div class="stat-divider"></div>
  <button class="stat-item stat-btn" onclick="openRanking()">
    <div class="stat-number" id="my-rank-display">-</div>
    <div class="stat-label">🏆 今月の順位 →</div>
    <div class="stat-sub" id="total-users-display"></div>
  </button>
</div>

<div id="ranking-overlay" onclick="closeRanking()">
  <div class="ranking-dialog" onclick="event.stopPropagation()">
    <div class="ranking-header">
      <span>🏆 今月の分析ランキング</span>
      <button onclick="closeRanking()">✕</button>
    </div>
    <div class="ranking-sub" id="ranking-sub">読み込み中…</div>
    <div id="ranking-list"></div>
  </div>
</div>

<div class="tabs-wrapper">
  <div class="tabs">
    <button class="tab active" data-meal="breakfast" onclick="switchTab('breakfast')">🌅 朝食<span class="tab-dot"></span></button>
    <button class="tab"        data-meal="lunch"      onclick="switchTab('lunch')"     >☀️ 昼食<span class="tab-dot"></span></button>
    <button class="tab"        data-meal="dinner"     onclick="switchTab('dinner')"    >🌙 夕食<span class="tab-dot"></span></button>
    <button class="tab"        data-meal="snack"      onclick="switchTab('snack')"     >🍪 間食<span class="tab-dot"></span></button>
  </div>
  <button class="btn-full-reset" onclick="confirmFullReset()">🔄<br>リセット</button>
</div>

<div id="reset-overlay" onclick="closeFullReset()">
  <div class="reset-dialog" onclick="event.stopPropagation()">
    <h3>データをリセット</h3>
    <p>朝食・昼食・夕食・間食のすべてのデータが消去されます。よろしいですか？</p>
    <div class="reset-btns">
      <button class="reset-cancel" onclick="closeFullReset()">キャンセル</button>
      <button class="reset-confirm" onclick="doFullReset()">リセットする</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="panel-breakfast" class="tab-panel active"></div>
  <div id="panel-lunch"     class="tab-panel"       ></div>
  <div id="panel-dinner"    class="tab-panel"       ></div>
  <div id="panel-snack"     class="tab-panel"       ></div>

</div>

<!-- 写真ソース選択シート -->
<input type="file" id="input-camera"  accept="image/*" capture="environment" style="display:none" onchange="onHiddenInputChange(this)">
<input type="file" id="input-library" accept="image/*" multiple           style="display:none" onchange="onHiddenInputChange(this)">

<div id="photo-source-sheet" onclick="closePhotoSheet()">
  <div class="photo-sheet-dialog" onclick="event.stopPropagation()">
    <button class="photo-sheet-btn" onclick="triggerCamera()">
      <span class="ps-icon">📷</span>写真を撮る
    </button>
    <div class="photo-sheet-divider"></div>
    <button class="photo-sheet-btn" onclick="triggerLibrary()">
      <span class="ps-icon">🖼</span>フォトライブラリから選ぶ
    </button>
    <button class="photo-sheet-cancel" onclick="closePhotoSheet()">キャンセル</button>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
// ═══════════════════════════════════════════
//  写真ソース選択シート
// ═══════════════════════════════════════════
let _photoMealId = null;

function openPhotoSheet(mealId) {
  _photoMealId = mealId;
  document.getElementById('photo-source-sheet').classList.add('show');
}
function closePhotoSheet() {
  document.getElementById('photo-source-sheet').classList.remove('show');
  _photoMealId = null;
}
function triggerCamera() {
  closePhotoSheet();
  document.getElementById('input-camera').click();
}
function triggerLibrary() {
  closePhotoSheet();
  document.getElementById('input-library').click();
}
function onHiddenInputChange(input) {
  const files = [...input.files];
  input.value = '';
  if (files.length && _photoMealId) addFiles(_photoMealId, files);
}

// ═══════════════════════════════════════════
//  ユーザーID（ブラウザごとに匿名UUID）
// ═══════════════════════════════════════════
function getOrCreateUserId() {
  const KEY = 'ab-diet-uid-v1';
  let uid = localStorage.getItem(KEY);
  if (!uid) {
    uid = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'u-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(KEY, uid);
  }
  return uid;
}
const USER_ID = getOrCreateUserId();

// ═══════════════════════════════════════════
//  Stats & Ranking
// ═══════════════════════════════════════════
async function loadStats() {
  try {
    const res = await fetch(`/api/stats?user_id=${encodeURIComponent(USER_ID)}`);
    const d = await res.json();
    applyStats(d);
  } catch(e) {}
}

function applyStats(d) {
  document.getElementById('today-users').textContent = d.today_users;
  if (d.my_rank) {
    document.getElementById('my-rank-display').textContent = `${d.my_rank}位`;
    document.getElementById('total-users-display').textContent = `全${d.total_users}人中`;
  } else {
    document.getElementById('my-rank-display').textContent = '-';
    document.getElementById('total-users-display').textContent = '';
  }
}

async function openRanking() {
  document.getElementById('ranking-overlay').classList.add('show');
  document.getElementById('ranking-sub').textContent = '読み込み中…';
  document.getElementById('ranking-list').innerHTML = '';
  try {
    const res = await fetch(`/api/stats?user_id=${encodeURIComponent(USER_ID)}`);
    const d = await res.json();
    applyStats(d);
    document.getElementById('ranking-sub').textContent =
      `過去30日間 ・ ${d.total_users}人が参加中`;
    const max = d.ranking.length ? d.ranking[0].count : 1;
    const medals = ['🥇','🥈','🥉'];
    document.getElementById('ranking-list').innerHTML = d.ranking.length
      ? d.ranking.map(r => {
          const label = medals[r.rank-1] || r.rank + '位';
          const pct = Math.round(r.count / max * 100);
          return `<div class="rank-row${r.is_me?' is-me':''}">
            <div class="rank-num">${label}</div>
            <div class="rank-bar-wrap">
              <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="rank-count">${r.count}回${r.is_me?'<span class="rank-me-badge">あなた</span>':''}</div>
          </div>`;
        }).join('')
      : '<div style="padding:24px;text-align:center;color:var(--text-muted)">まだデータがありません</div>';
  } catch(e) {
    document.getElementById('ranking-sub').textContent = '読み込みに失敗しました';
  }
}

function closeRanking() {
  document.getElementById('ranking-overlay').classList.remove('show');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRanking(); });

// ═══════════════════════════════════════════
//  定数・State
// ═══════════════════════════════════════════
const MEALS = [
  { id:'breakfast', label:'朝食', emoji:'🌅' },
  { id:'lunch',     label:'昼食', emoji:'☀️' },
  { id:'dinner',    label:'夕食', emoji:'🌙' },
  { id:'snack',     label:'間食', emoji:'🍪' },
];

const state = {};
MEALS.forEach(m => { state[m.id] = { items:[] }; });
let itemIdSeq = 0;
const STORAGE_KEY = 'ab-diet-state-v3';

// ═══════════════════════════════════════════
//  LocalStorage
// ═══════════════════════════════════════════
function saveState() {
  try {
    const data = { savedAt: Date.now() };
    MEALS.forEach(m => {
      data[m.id] = {
        items: state[m.id].items
          .filter(i => i.result)
          .map(i => ({ id:i.id, previewSrc:i.previewSrc, result:i.result }))
      };
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('save failed', e); }
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    MEALS.forEach(m => {
      if (data[m.id] && data[m.id].items && data[m.id].items.length) {
        state[m.id].items = data[m.id].items.map(i => ({
          ...i, file:null, loading:false, error:null
        }));
      }
    });
    const allIds = MEALS.flatMap(m => state[m.id].items.map(i => i.id));
    if (allIds.length) itemIdSeq = Math.max(...allIds);
  } catch(e) { console.warn('load failed', e); }
}


// ═══════════════════════════════════════════
//  Build panels（全食事共通）
// ═══════════════════════════════════════════
function buildPanel(m) {
  const panel = document.getElementById(`panel-${m.id}`);
  panel.innerHTML = `
    <div id="strip-${m.id}" class="meal-strip"></div>
    <div id="analyze-wrap-${m.id}" class="analyze-meal-wrap" style="display:none">
      <button class="btn-analyze-meal" onclick="analyzeMeal('${m.id}')">✨ Bカウントする</button>
    </div>
    <div class="meal-add" id="add-${m.id}" onclick="openPhotoSheet('${m.id}')">
      <div class="meal-add-icon">${m.emoji}</div>
      <h3>${m.label}の写真を追加</h3>
      <p>タップして写真を選ぶ</p>
    </div>
    <div class="meal-error"  id="err-${m.id}"></div>
    <div class="meal-result" id="res-${m.id}" style="margin-top:8px"></div>
  `;
  // drag & drop（デスクトップ向け）
  const addEl = document.getElementById(`add-${m.id}`);
  addEl.addEventListener('dragover',  e => { e.preventDefault(); addEl.classList.add('drag-over'); });
  addEl.addEventListener('dragleave', () => addEl.classList.remove('drag-over'));
  addEl.addEventListener('drop', e => {
    e.preventDefault(); addEl.classList.remove('drag-over');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    if (files.length) addFiles(m.id, files);
  });
  // restore saved state
  if (state[m.id].items.length) {
    renderStrip(m.id);
    renderResults(m.id);
    updateTabDot(m.id);
    updateAnalyzeBtn(m.id);
  }
}

// ═══════════════════════════════════════════
//  Tab switching
// ═══════════════════════════════════════════
function switchTab(mealId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[data-meal="${mealId}"]`).classList.add('active');
  document.getElementById(`panel-${mealId}`).classList.add('active');
}

// ═══════════════════════════════════════════
//  File handling
// ═══════════════════════════════════════════
async function addFiles(mealId, files) {
  for (const file of files) {
    const id = ++itemIdSeq;
    const item = { id, file:null, previewSrc:null, result:null, loading:false, error:null };
    state[mealId].items.push(item);
    renderStrip(mealId);
    const [compressed, thumb] = await Promise.all([compressImage(file), createThumbnail(file)]);
    item.file = compressed;
    item.previewSrc = thumb;
    renderStrip(mealId);
    updateTabDot(mealId);
    updateAnalyzeBtn(mealId);
  }
}

function removeItem(mealId, itemId) {
  state[mealId].items = state[mealId].items.filter(i => i.id !== itemId);
  renderStrip(mealId);
  renderResults(mealId);
  updateTabDot(mealId);
  updateAnalyzeBtn(mealId);
  saveState();
  updateTotalB();
}

// ═══════════════════════════════════════════
//  Render strip（サムネイル一覧）
// ═══════════════════════════════════════════
function renderStrip(mealId) {
  const strip = document.getElementById(`strip-${mealId}`);
  if (!strip) return;
  strip.innerHTML = state[mealId].items.map(item => {
    const cnt = item.result ? fmtCount(item.result.total_b_count) : null;
    const isGoodOnly = item.result && item.result.total_b_count > 0 &&
      item.result.foods.every(f => f.category !== 'B');
    return `
      <div class="meal-thumb">
        ${item.previewSrc
          ? `<img src="${item.previewSrc}" alt="" onclick="openLightbox('${item.previewSrc}')" style="cursor:zoom-in">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;">📷</div>`}
        ${item.loading ? `<div class="th-spinner"><div class="th-spin"></div></div>` : ''}
        ${!item.result && !item.loading ? `<button class="th-remove" onclick="removeItem('${mealId}',${item.id})">✕</button>` : ''}
        ${cnt !== null ? `<div class="th-badge${isGoodOnly?' good':''}">B ${cnt}</div>` : ''}
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  Render results
// ═══════════════════════════════════════════
function renderResults(mealId) {
  const resEl = document.getElementById(`res-${mealId}`);
  if (!resEl) return;
  const done = state[mealId].items.filter(i => i.result);
  if (!done.length) { resEl.style.display='none'; resEl.innerHTML=''; return; }

  const m = MEALS.find(x => x.id === mealId);
  const totalB = done.reduce((s,i) => s + i.result.total_b_count, 0);
  const multiLabel = done.length > 1 ? `${done.length}枚分` : '';

  const cards = done.map((item, idx) => `
    <div class="item-result-card">
      <div class="item-result-header">
        <span>${m.emoji} ${m.label}${done.length > 1 ? ` ${idx+1}` : ''}</span>
        <span class="ic-cnt">B ${fmtCount(item.result.total_b_count)}</span>
      </div>
      <div style="padding:10px 14px 14px">
        <img class="result-photo" src="${item.previewSrc}" alt="" onclick="openLightbox('${item.previewSrc}')" style="cursor:zoom-in">
        <div class="advice-row"><div class="icon">💡</div><p>${esc(item.result.advice||'')}</p></div>
        <div class="food-list-wrap">
          <div class="food-list-header">食材の内訳</div>
          ${buildFoodRows(item.result.foods)}
        </div>
      </div>
    </div>`).join('');

  resEl.innerHTML = `
    <div class="meal-b-count" style="margin-bottom:12px">
      <div>
        <div class="label">${m.label}の Bカウント</div>
        ${multiLabel ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${multiLabel}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="count">${fmtCount(totalB)}</div>
        <div class="unit">カウント</div>
      </div>
    </div>
    ${cards}
    <button class="re-analyze" onclick="resetMeal('${mealId}')">↩ ${m.label}をリセット</button>
  `;
  resEl.style.display = 'block';
}

function resetMeal(mealId) {
  state[mealId].items = [];
  renderStrip(mealId);
  renderResults(mealId);
  updateTabDot(mealId);
  document.getElementById(`err-${mealId}`).style.display = 'none';
  saveState();
  updateTotalB();
}

function updateTabDot(mealId) {
  const tab = document.querySelector(`.tab[data-meal="${mealId}"]`);
  const hasPending = state[mealId].items.some(i => i.file && !i.result);
  const hasDone    = state[mealId].items.some(i => i.result);
  tab.classList.toggle('has-photo', hasPending && !hasDone);
  tab.classList.toggle('done', hasDone);
}


async function analyzeItem(mealId, itemId) {
  const item = state[mealId].items.find(i => i.id === itemId);
  if (!item || !item.file) return;

  item.loading = true;
  renderStrip(mealId);

  const formData = new FormData();
  formData.append('image', item.file);
  formData.append('user_id', USER_ID);
  try {
    const res  = await fetch('/analyze', { method:'POST', body:formData });
    const data = await res.json();
    item.loading = false;
    if (data.error) {
      item.error = data.error;
      showError(mealId, data.error);
    } else {
      item.result = data;
    }
  } catch(e) {
    item.loading = false;
    showError(mealId, '通信エラーが発生しました。再度お試しください。');
  }
  renderStrip(mealId);
  renderResults(mealId);
  updateTabDot(mealId);
  updateAnalyzeBtn(mealId);
  saveState();
  updateTotalB();
  loadStats();
}

function showError(mealId, msg) {
  const el = document.getElementById(`err-${mealId}`);
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}


// ═══════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════
function buildFoodRows(foods) {
  return (foods||[]).map(food => {
    const isB     = food.category === 'B';
    const isGoodB = food.category === 'グッドB';
    const hasCount = isB || isGoodB;
    const badgeClass = isB ? 'badge-b' : isGoodB ? 'badge-good-b' : 'badge-a';
    const badgeLabel = isB ? 'B食材'   : isGoodB ? 'グッドB'      : 'A食材';
    return `
      <div class="food-row">
        <div>
          <div class="food-name">${esc(food.name)}</div>
          <div class="food-meta">
            <span class="food-badge ${badgeClass}">${badgeLabel}</span>
            約${food.kcal_per_serving}kcal ・ ${esc(food.amount)}
          </div>
          <div class="food-meta">${esc(food.reason)}</div>
        </div>
        <div class="food-cnt">
          <div class="n ${!hasCount?'zero':''}">${hasCount ? fmtCount(food.b_count) : '−'}</div>
          <div class="u">${isB ? 'Bカウント' : isGoodB ? 'グッドB' : 'A食材'}</div>
        </div>
      </div>`;
  }).join('');
}

function fmtCount(n) {
  if (n === undefined || n === null) return '0';
  return parseFloat(n.toFixed(2)).toString();
}

function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      let {width:w, height:h} = img;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
        else       { w = Math.round(w*MAX/h); h = MAX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.85;
      const go = () => c.toBlob(b => {
        if (b.size > 4*1024*1024 && q > 0.3) { q = Math.round((q-0.1)*10)/10; go(); }
        else resolve(new File([b], file.name.replace(/\.[^.]+$/,'.jpg'), {type:'image/jpeg'}));
      }, 'image/jpeg', q);
      go();
    };
    img.src = URL.createObjectURL(file);
  });
}

function createThumbnail(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 600;
      let {width:w, height:h} = img;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
        else       { w = Math.round(w*MAX/h); h = MAX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsDataURL(b);
      }, 'image/jpeg', 0.72);
    };
    img.src = URL.createObjectURL(file);
  });
}

// ═══════════════════════════════════════════
//  食事別「Bカウントする」ボタン制御
// ═══════════════════════════════════════════
function updateAnalyzeBtn(mealId) {
  const wrap = document.getElementById(`analyze-wrap-${mealId}`);
  if (!wrap) return;
  const hasPending = state[mealId].items.some(i => i.file && !i.result && !i.loading);
  wrap.style.display = hasPending ? 'block' : 'none';
}

async function analyzeMeal(mealId) {
  const btn = document.querySelector(`#analyze-wrap-${mealId} .btn-analyze-meal`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 分析中…'; }
  const pending = state[mealId].items.filter(i => i.file && !i.result && !i.loading);
  await Promise.all(pending.map(i => analyzeItem(mealId, i.id)));
  if (btn) { btn.disabled = false; btn.textContent = '✨ Bカウントする'; }
  updateAnalyzeBtn(mealId);
}

// ═══════════════════════════════════════════
//  今日のBカウント合計
// ═══════════════════════════════════════════
function updateTotalB() {
  let total = 0;
  MEALS.forEach(m => {
    state[m.id].items.filter(i => i.result).forEach(i => {
      total += i.result.total_b_count;
    });
  });
  const el = document.getElementById('daily-total-count');
  if (el) el.textContent = fmtCount(total);
}

// ═══════════════════════════════════════════
//  全データリセット
// ═══════════════════════════════════════════
function confirmFullReset() { document.getElementById('reset-overlay').classList.add('show'); }
function closeFullReset()   { document.getElementById('reset-overlay').classList.remove('show'); }
function doFullReset() {
  closeFullReset();
  MEALS.forEach(m => { state[m.id] = { items: [] }; });
  itemIdSeq = 0;
  localStorage.removeItem(STORAGE_KEY);
  MEALS.forEach(m => buildPanel(m));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('done','has-photo'));
  switchTab('breakfast');
  updateTotalB();
}

// ═══════════════════════════════════════════
//  Lightbox
// ═══════════════════════════════════════════
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// warmup
(function() {
  const banner = document.getElementById('warmup-banner');
  const t = setTimeout(() => { banner.style.display = 'flex'; }, 2000);
  function ping() {
    fetch('/api/status').then(r => r.json())
      .then(() => { clearTimeout(t); banner.style.display = 'none'; })
      .catch(() => setTimeout(ping, 5000));
  }
  ping();
})();

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
loadSavedState();
MEALS.forEach(m => buildPanel(m));
updateTotalB();
loadStats();
</script>
</body>
