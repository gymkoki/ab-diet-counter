<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABダイエット Bカウンター</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.png">
  <!-- PWA: ホーム画面に追加 -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bカウンター">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#FF6B35">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #FF6B35; --primary-dark: #FF4500; --pink: #FF6B9D;
      --bg: #F7F4EF; --surface: #FFFFFF; --text: #1A1A2E;
      --text-muted: #6B7280; --border: #E5E7EB;
      --b-color: #FF6B35; --a-color: #2EC4B6;
      --shadow: 0 4px 24px rgba(0,0,0,0.08); --radius: 16px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 76px; }

    /* bottom nav */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--surface); box-shadow:0 -2px 16px rgba(0,0,0,0.08); z-index:150; padding-bottom:env(safe-area-inset-bottom,0); }
    .bottom-nav-item { flex:1; padding:10px 0 8px; border:none; background:none; font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer; line-height:1.5; transition:color 0.15s; }
    .bottom-nav-item .bn-icon { font-size:20px; display:block; margin-bottom:2px; }
    .bottom-nav-item.active { color:var(--primary); }

    /* history view */
    .history-card { background:var(--surface); margin:12px 16px; border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
    .history-card h2 { font-size:17px; font-weight:800; margin-bottom:4px; }
    .history-card .history-range { font-size:13px; color:var(--text-muted); margin-bottom:14px; }
    .history-row { display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border); }
    .history-row:last-child { border-bottom:none; }
    .history-date { font-size:16px; font-weight:700; }
    .history-date .dow { font-size:13px; color:var(--text-muted); font-weight:600; margin-left:4px; }
    .history-count { font-size:24px; font-weight:900; color:#6366F1; }
    .history-unit { font-size:12px; font-weight:600; color:#6366F1; opacity:0.8; }
    .history-empty { text-align:center; padding:40px 16px; color:var(--text-muted); font-size:14px; line-height:1.8; }
    .history-total { display:flex; align-items:center; justify-content:space-between; background:#F5F3FF; border-radius:12px; padding:14px 16px; margin-top:14px; }
    .history-total .label { font-size:14px; font-weight:700; color:#5B21B6; }
    .history-total .count { font-size:28px; font-weight:900; color:#6366F1; }
    header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 10px 16px; text-align: center; }
    header h1 { font-size: 17px; font-weight: 800; white-space: nowrap; }
    .header-users { font-size: 17px; font-weight: 800; }
    header p  { margin-top: 2px; font-size: 11px; opacity: 0.85; }

    /* warmup */
    #warmup-banner { display:none; margin:12px 16px 0; background:#FFF8E7; border:1px solid #FCD34D; border-radius:10px; padding:12px 16px; font-size:12px; color:#92400E; align-items:center; gap:10px; }
    .ws { width:16px; height:16px; border:2px solid #FCD34D; border-top-color:#D97706; border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }

    /* panels */
    .container { padding:0 16px 48px; }
    .tab-panel { display:block; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:16px; }

    /* photo strip */
    .meal-strip { display:flex; gap:10px; padding:14px 16px 4px; flex-wrap:wrap; }
    .meal-thumb { position:relative; width:88px; height:88px; flex-shrink:0; border-radius:12px; overflow:hidden; background:var(--bg); border:2px solid var(--border); }
    .meal-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .meal-thumb .th-remove { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); color:white; border:none; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .meal-thumb .th-badge { position:absolute; bottom:4px; left:4px; right:4px; background:rgba(255,107,53,0.88); color:white; font-size:10px; font-weight:800; border-radius:6px; padding:2px 4px; text-align:center; }
    .meal-thumb .th-badge.good { background:rgba(217,119,6,0.88); }
    .meal-thumb .th-spinner { position:absolute; inset:0; background:rgba(255,255,255,0.75); display:flex; align-items:center; justify-content:center; }
    .th-spin { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }

    /* add-photo area */
    .meal-add { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px; cursor:pointer; border:2px dashed var(--border); border-radius:12px; margin:10px 16px 4px; transition:border-color 0.2s, background 0.2s; position:relative; }
    .meal-add:hover { border-color:var(--primary); background:#FFF5F0; }
    .meal-add input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .meal-add-icon { font-size:26px; }
    .meal-add h3 { font-size:17px; font-weight:700; }
    .meal-add p  { font-size:14px; color:var(--text-muted); }

    /* loading */
    .meal-loading { display:none; text-align:center; padding:24px 16px; }
    .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .meal-loading p { color:var(--text-muted); font-size:13px; }

    /* result */
    .meal-result { display:none; padding:0 16px 16px; }
    .meal-b-count { background:#FFF5F0; border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .meal-b-count .label { font-size:15px; font-weight:700; color:var(--text-muted); }
    .meal-b-count .count { font-size:42px; font-weight:900; color:var(--primary); line-height:1; }
    .meal-b-count .unit  { font-size:15px; font-weight:600; color:var(--primary); }
    .result-photo { width:100%; border-radius:10px; max-height:200px; object-fit:cover; display:block; margin-bottom:12px; }
    .advice-row { display:flex; gap:8px; align-items:flex-start; background:var(--bg); border-radius:10px; padding:12px; margin-bottom:12px; }
    .advice-row .icon { font-size:18px; flex-shrink:0; }
    .advice-row p { font-size:15px; color:var(--text-muted); line-height:1.6; }
    .food-list-wrap { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .food-list-header { padding:10px 14px; background:var(--bg); font-size:15px; font-weight:700; border-bottom:1px solid var(--border); }
    .food-row { display:grid; grid-template-columns:1fr auto; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border); align-items:start; }
    .food-row:last-child { border-bottom:none; }
    .food-name { font-size:16px; font-weight:600; margin-bottom:4px; }
    .food-meta { font-size:13px; color:var(--text-muted); line-height:1.5; }
    .food-badge { display:inline-flex; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:700; margin-right:3px; }
    .badge-b      { background:#FFF0EB; color:var(--b-color); }
    .badge-a      { background:#E8F9F8; color:var(--a-color); }
    .food-cnt { text-align:right; }
    .food-cnt .n { font-size:22px; font-weight:800; color:var(--b-color); line-height:1; }
    .food-cnt .n.zero { color:var(--a-color); }
    .food-cnt .u { font-size:12px; color:var(--text-muted); }

    /* multi-result cards */
    .item-result-card { border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:12px; }
    .item-result-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--border); font-size:15px; font-weight:700; }
    .item-result-header .ic-cnt { color:var(--primary); font-size:18px; font-weight:900; }

    .re-analyze { width:100%; margin-top:10px; padding:12px; border-radius:10px; background:none; border:1.5px solid var(--border); font-size:15px; font-weight:700; color:var(--text-muted); cursor:pointer; }
    .re-analyze:hover { border-color:var(--primary); color:var(--primary); }
    .reset-caption { text-align:center; font-size:12px; color:var(--text-muted); margin-top:6px; }

    /* 計算し直す */
    .recalc-btn { width:100%; margin-top:8px; padding:11px; border-radius:10px; background:none; border:1.5px dashed var(--border); font-size:15px; font-weight:700; color:var(--text-muted); cursor:pointer; transition:all 0.15s; }
    .recalc-btn:hover { border-color:#6366F1; color:#6366F1; }
    .recalc-form { display:none; margin-top:8px; padding:12px; background:#F5F3FF; border:1.5px solid #C4B5FD; border-radius:12px; }
    .recalc-form.open { display:block; }
    .recalc-form label { font-size:14px; font-weight:700; color:#5B21B6; display:block; margin-bottom:6px; }
    .recalc-textarea { width:100%; min-height:80px; padding:10px; border:1px solid #C4B5FD; border-radius:8px; font-size:15px; font-family:inherit; resize:vertical; outline:none; background:white; }
    .recalc-textarea:focus { border-color:#6366F1; }
    .btn-recalc { width:100%; margin-top:8px; padding:13px; border-radius:10px; border:none; background:linear-gradient(135deg,#6366F1,#4F46E5); color:white; font-size:15px; font-weight:800; cursor:pointer; transition:opacity 0.2s; }
    .btn-recalc:disabled { opacity:0.45; cursor:not-allowed; }

    /* error */
    .meal-error { display:none; margin:0 16px 16px; background:#FEF2F2; border:1px solid #FECACA; border-radius:10px; padding:12px 14px; font-size:14px; color:#DC2626; }



    /* result card delete button */
    .result-delete-btn { background:none; border:none; font-size:16px; cursor:pointer; padding:4px; border-radius:8px; opacity:0.6; transition:opacity 0.15s; }
    .result-delete-btn:active { opacity:1; }

    /* lightbox */
    #lightbox { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; cursor:zoom-out; }
    #lightbox.show { display:flex; }
    #lightbox img { max-width:96vw; max-height:92vh; object-fit:contain; border-radius:8px; cursor:default; }
    #lightbox-close { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.15); color:white; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>

<header>
  <h1>ABダイエットアプリ<span class="header-users" id="header-users"></span></h1>
</header>

<div id="warmup-banner">
  <div class="ws"></div>
  <span>サーバー起動中… 初回のみ30秒ほどかかります ☕</span>
</div>

<div id="view-main">

<div class="container" style="padding-top:12px">
  <div id="panel-breakfast" class="tab-panel active"></div>
  <div id="panel-lunch"     class="tab-panel"       ></div>
  <div id="panel-dinner"    class="tab-panel"       ></div>
  <div id="panel-snack"     class="tab-panel"       ></div>

</div>

</div>

<div id="view-history" style="display:none">
  <div class="history-card">
    <h2>📊 今週のBカウント履歴</h2>
    <div class="history-range" id="history-range">読み込み中…</div>
    <div id="history-list"></div>
    <div class="history-total" id="history-total" style="display:none">
      <span class="label">1日平均</span>
      <span class="count" id="history-total-count">-</span>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <button class="bottom-nav-item active" id="nav-main" onclick="switchView('main')">
    <span class="bn-icon">📷</span>記録
  </button>
  <button class="bottom-nav-item" id="nav-history" onclick="switchView('history')">
    <span class="bn-icon">📊</span>今週の履歴
  </button>
</div>

<!-- 写真選択（ネイティブiOSピッカーを直接表示） -->
<input type="file" id="input-file" accept="image/*" multiple style="display:none" onchange="onHiddenInputChange(this)">

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
// ═══════════════════════════════════════════
//  写真選択（ネイティブiOSピッカーを直接表示）
// ═══════════════════════════════════════════
let _photoMealId = null;

function openFileInput(mealId) {
  _photoMealId = mealId;
  document.getElementById('input-file').click();
}
function onHiddenInputChange(input) {
  const files = [...input.files];
  input.value = '';
  const mealId = _photoMealId;
  _photoMealId = null;
  if (files.length && mealId) addFiles(mealId, files);
}

// ═══════════════════════════════════════════
//  ユーザーID（ブラウザごとに匿名UUID）
// ═══════════════════════════════════════════
function getOrCreateUserId() {
  const KEY = 'ab-diet-uid-v1';
  let uid = localStorage.getItem(KEY);
  if (!uid) {
    uid = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'u-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(KEY, uid);
  }
  return uid;
}
const USER_ID = getOrCreateUserId();

// ═══════════════════════════════════════════
//  Stats & Ranking
// ═══════════════════════════════════════════
async function loadStats() {
  try {
    const res = await fetch(`/api/stats?user_id=${encodeURIComponent(USER_ID)}`);
    const d = await res.json();
    applyStats(d);
  } catch(e) {}
}

function applyStats(d) {
  const el = document.getElementById('header-users');
  if (el) el.textContent = `（今日の利用者${d.today_users}名）`;
}

// ═══════════════════════════════════════════
//  定数・State
// ═══════════════════════════════════════════
const MEALS = [
  { id:'breakfast', label:'朝食', emoji:'🌅' },
  { id:'lunch',     label:'昼食', emoji:'☀️' },
  { id:'dinner',    label:'夕食', emoji:'🌙' },
  { id:'snack',     label:'間食', emoji:'🍪' },
];

const state = {};
MEALS.forEach(m => { state[m.id] = { items:[] }; });
let itemIdSeq = 0;
const STORAGE_KEY = 'ab-diet-state-v3';

// ═══════════════════════════════════════════
//  LocalStorage
// ═══════════════════════════════════════════
function saveState() {
  try {
    const data = { savedAt: Date.now() };
    MEALS.forEach(m => {
      data[m.id] = {
        items: state[m.id].items
          .filter(i => i.result)
          .map(i => ({ id:i.id, previewSrc:i.previewSrc, result:i.result }))
      };
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('save failed', e); }
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    MEALS.forEach(m => {
      if (data[m.id] && data[m.id].items && data[m.id].items.length) {
        state[m.id].items = data[m.id].items.map(i => ({
          ...i, file:null, loading:false, error:null
        }));
      }
    });
    const allIds = MEALS.flatMap(m => state[m.id].items.map(i => i.id));
    if (allIds.length) itemIdSeq = Math.max(...allIds);
  } catch(e) { console.warn('load failed', e); }
}


// ═══════════════════════════════════════════
//  Build panels（全食事共通）
// ═══════════════════════════════════════════
function buildPanel(m) {
  const panel = document.getElementById(`panel-${m.id}`);
  panel.innerHTML = `
    <div id="strip-${m.id}" class="meal-strip"></div>
    <div class="meal-add" id="add-${m.id}" onclick="openFileInput('${m.id}')">
      <div class="meal-add-icon">${m.emoji}</div>
      <h3>${m.label}の写真を追加</h3>
      <p>タップして写真を選ぶ</p>
    </div>
    <div class="meal-error"  id="err-${m.id}"></div>
    <div class="meal-result" id="res-${m.id}" style="margin-top:8px"></div>
  `;
  // drag & drop（デスクトップ向け）
  const addEl = document.getElementById(`add-${m.id}`);
  addEl.addEventListener('dragover',  e => { e.preventDefault(); addEl.classList.add('drag-over'); });
  addEl.addEventListener('dragleave', () => addEl.classList.remove('drag-over'));
  addEl.addEventListener('drop', e => {
    e.preventDefault(); addEl.classList.remove('drag-over');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    if (files.length) addFiles(m.id, files);
  });
  // restore saved state
  if (state[m.id].items.length) {
    renderStrip(m.id);
    renderResults(m.id);
  }
}

// ═══════════════════════════════════════════
//  File handling
// ═══════════════════════════════════════════
async function addFiles(mealId, files) {
  for (const file of files) {
    const id = ++itemIdSeq;
    const item = { id, file:null, previewSrc:null, result:null, loading:false, error:null };
    state[mealId].items.push(item);
    renderStrip(mealId);
    const [compressed, thumb] = await Promise.all([compressImage(file), createThumbnail(file)]);
    item.file = compressed;
    item.previewSrc = thumb;
    renderStrip(mealId);
    analyzeItem(mealId, id);
  }
}

function removeItem(mealId, itemId) {
  state[mealId].items = state[mealId].items.filter(i => i.id !== itemId);
  renderStrip(mealId);
  renderResults(mealId);
  saveState();
}

// ═══════════════════════════════════════════
//  Render strip（サムネイル一覧）
// ═══════════════════════════════════════════
function renderStrip(mealId) {
  const strip = document.getElementById(`strip-${mealId}`);
  if (!strip) return;
  strip.innerHTML = state[mealId].items.map(item => {
    const cnt = item.result ? fmtCount(item.result.total_b_count) : null;
    const isGoodOnly = item.result && item.result.total_b_count > 0 &&
      item.result.foods.every(f => f.category !== 'B');
    return `
      <div class="meal-thumb">
        ${item.previewSrc
          ? `<img src="${item.previewSrc}" alt="" onclick="openLightbox('${item.previewSrc}')" style="cursor:zoom-in">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;">📷</div>`}
        ${item.loading ? `<div class="th-spinner"><div class="th-spin"></div></div>` : ''}
        ${!item.loading ? `<button class="th-remove" onclick="removeItem('${mealId}',${item.id})">✕</button>` : ''}
        ${cnt !== null ? `<div class="th-badge${isGoodOnly?' good':''}">B ${cnt}</div>` : ''}
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  Render results
// ═══════════════════════════════════════════
function renderResults(mealId) {
  const resEl = document.getElementById(`res-${mealId}`);
  if (!resEl) return;
  const done = state[mealId].items.filter(i => i.result);
  if (!done.length) { resEl.style.display='none'; resEl.innerHTML=''; return; }

  const m = MEALS.find(x => x.id === mealId);
  const totalB = done.reduce((s,i) => s + i.result.total_b_count, 0);
  const multiLabel = done.length > 1 ? `${done.length}枚分` : '';

  const cards = done.map((item, idx) => `
    <div class="item-result-card">
      <div class="item-result-header">
        <span>${m.emoji} ${m.label}${done.length > 1 ? ` ${idx+1}` : ''}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="ic-cnt">B ${fmtCount(item.result.total_b_count)}</span>
          <button class="result-delete-btn" onclick="removeItem('${mealId}',${item.id})" title="この写真と計算を削除">🗑</button>
        </div>
      </div>
      <div style="padding:10px 14px 14px">
        <img class="result-photo" src="${item.previewSrc}" alt="" onclick="openLightbox('${item.previewSrc}')" style="cursor:zoom-in">
        <div class="advice-row"><div class="icon">💡</div><p>${esc(item.result.advice||'')}</p></div>
        <div class="food-list-wrap">
          <div class="food-list-header">食材の内訳</div>
          ${buildFoodRows(item.result.foods)}
        </div>
        <button class="recalc-btn" onclick="toggleRecalcForm('${mealId}',${item.id})">✏️ 計算し直す</button>
        <div class="recalc-form" id="recalc-form-${mealId}-${item.id}">
          <label>補足・訂正内容を入力してください</label>
          <textarea class="recalc-textarea" id="recalc-text-${mealId}-${item.id}" placeholder="例：このヨーグルトは無脂肪ヨーグルトなのでA食材です。"></textarea>
          <button class="btn-recalc" onclick="reanalyzeItem('${mealId}',${item.id})">🔄 再計算する</button>
        </div>
      </div>
    </div>`).join('');

  resEl.innerHTML = `
    <div class="meal-b-count" style="margin-bottom:12px">
      <div>
        <div class="label">${m.label}の Bカウント</div>
        ${multiLabel ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${multiLabel}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="count">${fmtCount(totalB)}</div>
        <div class="unit">カウント</div>
      </div>
    </div>
    ${cards}
    <button class="re-analyze" onclick="resetMeal('${mealId}')">↩ ${m.label}をリセット</button>
  `;
  resEl.style.display = 'block';
}

function resetMeal(mealId) {
  state[mealId].items = [];
  renderStrip(mealId);
  renderResults(mealId);
  document.getElementById(`err-${mealId}`).style.display = 'none';
  saveState();
}


async function analyzeItem(mealId, itemId) {
  const item = state[mealId].items.find(i => i.id === itemId);
  if (!item || !item.file) return;

  item.loading = true;
  renderStrip(mealId);

  const formData = new FormData();
  formData.append('image', item.file);
  formData.append('user_id', USER_ID);
  try {
    const res  = await fetch('/analyze', { method:'POST', body:formData });
    const data = await res.json();
    item.loading = false;
    if (data.error) {
      item.error = data.error;
      showError(mealId, data.error);
    } else {
      item.result = data;
    }
  } catch(e) {
    item.loading = false;
    showError(mealId, '通信エラーが発生しました。再度お試しください。');
  }
  renderStrip(mealId);
  renderResults(mealId);
  saveState();
  loadStats();
}

function toggleRecalcForm(mealId, itemId) {
  const form = document.getElementById(`recalc-form-${mealId}-${itemId}`);
  if (!form) return;
  form.classList.toggle('open');
  if (form.classList.contains('open')) {
    document.getElementById(`recalc-text-${mealId}-${itemId}`)?.focus();
  }
}

function dataURLtoBlob(dataUrl) {
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], {type: mime});
}

async function reanalyzeItem(mealId, itemId) {
  const item = state[mealId].items.find(i => i.id === itemId);
  if (!item) return;

  const textarea = document.getElementById(`recalc-text-${mealId}-${itemId}`);
  const btn = document.querySelector(`#recalc-form-${mealId}-${itemId} .btn-recalc`);
  const correction = textarea?.value?.trim();
  if (!correction) { textarea?.focus(); return; }

  if (btn) { btn.disabled = true; btn.textContent = '⏳ 再計算中…'; }

  const blob = dataURLtoBlob(item.previewSrc);
  const formData = new FormData();
  formData.append('image', blob, 'image.jpg');
  formData.append('correction', correction);
  formData.append('user_id', USER_ID);

  try {
    const res = await fetch('/reanalyze', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) {
      showError(mealId, data.error);
    } else {
      item.result = data;
      renderResults(mealId);
      saveState();
    }
  } catch(e) {
    showError(mealId, '通信エラーが発生しました。再度お試しください。');
  }

  if (btn) { btn.disabled = false; btn.textContent = '🔄 再計算する'; }
}

function showError(mealId, msg) {
  const el = document.getElementById(`err-${mealId}`);
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

function buildFoodRows(foods) {
  return (foods||[]).map(food => {
    const isB     = food.category === 'B' || food.category === 'Good B' || food.category === 'グッドB';
    const hasCount = isB;
    const badgeClass = isB ? 'badge-b' : 'badge-a';
    const badgeLabel = isB ? 'B食材'   : 'A食材';
    const unitLabel  = isB ? 'Bカウント' : 'A食材';
    return `
      <div class="food-row">
        <div>
          <div class="food-name">${esc(food.name)}</div>
          <div class="food-meta">
            <span class="food-badge ${badgeClass}">${badgeLabel}</span>
            約${food.kcal_per_serving}kcal ・ ${esc(food.amount)}
          </div>
          <div class="food-meta">${esc(food.reason)}</div>
        </div>
        <div class="food-cnt">
          <div class="n ${!hasCount?'zero':''}">${hasCount ? fmtCount(food.b_count) : '−'}</div>
          <div class="u">${unitLabel}</div>
        </div>
      </div>`;
  }).join('');
}

function fmtCount(n) {
  if (n === undefined || n === null) return '0';
  return parseFloat(n.toFixed(2)).toString();
}

function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      let {width:w, height:h} = img;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
        else       { w = Math.round(w*MAX/h); h = MAX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.85;
      const go = () => c.toBlob(b => {
        if (b.size > 4*1024*1024 && q > 0.3) { q = Math.round((q-0.1)*10)/10; go(); }
        else resolve(new File([b], file.name.replace(/\.[^.]+$/,'.jpg'), {type:'image/jpeg'}));
      }, 'image/jpeg', q);
      go();
    };
    img.src = URL.createObjectURL(file);
  });
}

function createThumbnail(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 600;
      let {width:w, height:h} = img;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
        else       { w = Math.round(w*MAX/h); h = MAX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsDataURL(b);
      }, 'image/jpeg', 0.72);
    };
    img.src = URL.createObjectURL(file);
  });
}

function getTodayJST() {

    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
  }).replace(/\//g, '-');
}

function switchView(view) {
  document.getElementById('view-main').style.display    = (view === 'main') ? '' : 'none';
  document.getElementById('view-history').style.display = (view === 'history') ? '' : 'none';
  document.getElementById('nav-main').classList.toggle('active', view === 'main');
  document.getElementById('nav-history').classList.toggle('active', view === 'history');
  if (view === 'history') loadHistory();
}

const WEEKDAY_JA = ['日','月','火','水','木','金','土'];

async function loadHistory() {
  const rangeEl = document.getElementById('history-range');
  const listEl  = document.getElementById('history-list');
  const totalEl = document.getElementById('history-total');
  const totalCountEl = document.getElementById('history-total-count');
  rangeEl.textContent = '読み込み中…';
  listEl.innerHTML = '';
  totalEl.style.display = 'none';
  try {
    const res  = await fetch(`/api/weekly-b?user_id=${encodeURIComponent(USER_ID)}`);
    const data = await res.json();
    const fmtDate = (s) => {
      const d = new Date(s + 'T00:00:00');
      return `${d.getMonth()+1}/${d.getDate()}`;
    };
    const dow = (s) => {
      const d = new Date(s + 'T00:00:00');
      return WEEKDAY_JA[d.getDay()];
    };
    rangeEl.textContent = `${fmtDate(data.week_start)} 〜 ${fmtDate(data.week_end)}`;

    const daily = (data.daily || []).slice().sort((a,b) => a.date.localeCompare(b.date));
    if (daily.length === 0) {
      listEl.innerHTML = '<div class="history-empty">まだ記録がありません。<br>下の「リセット」ボタンで1日の記録を保存すると、ここに表示されます。</div>';
      return;
    }
    listEl.innerHTML = daily.map(d => `
      <div class="history-row">
        <div class="history-date">${fmtDate(d.date)}<span class="dow">(${dow(d.date)})</span></div>
        <div><span class="history-count">${fmtCount(d.b_count)}</span><span class="history-unit"> カウント</span></div>
      </div>
    `).join('');
    const avg = data.days_count > 0 ? data.week_total / data.days_count : 0;
    totalCountEl.textContent = `${fmtCount(avg)} カウント / 日`;
    totalEl.style.display = 'flex';
  } catch(e) {
    rangeEl.textContent = '読み込みに失敗しました';
  }
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;

}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
